name: Woow HA Pi Agent
version: "0.1.0"
slug: woow_ha_pi_agent
description: pi-web (agegr/pi-web) + pi coding agent SDK (earendil-works/pi), pre-wired to WoowTech GLM (智譜清言)
url: https://github.com/WOOWTECH/Woow_ha_pi_agent_add_on
webui: "http://[HOST]:[PORT:30141]"
hassio_api: true
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
map:
  - type: addon_config
    read_only: false
  - type: share
    read_only: false
backup: cold
backup_exclude:
  - "**/sessions/*.jsonl.tmp"
ports:
  30141/tcp: 30141
ports_description:
  30141/tcp: pi-web UI
options:
  api_key: ""
  extra_allowed_hosts: ""
schema:
  api_key: password
  extra_allowed_hosts: str?
image: ghcr.io/woowtech/woow-ha-pi-agent-{arch}
