name: Woow HA Pi Agent
version: "0.10.4"
slug: woow_ha_pi_agent
description: pi-web + pi coding agent SDK, pre-wired to GLM / MiniMax / OpenAI / OpenRouter / Anthropic / DeepSeek / Groq (BYOK)
url: https://github.com/WOOWTECH/Woow_ha_pi_agent_add_on
hassio_api: true
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
map:
  - type: addon_config
    read_only: false
  - type: share
    read_only: false
backup: cold
backup_exclude:
  - "**/sessions/*.jsonl.tmp"
  - "**/home/**/node_modules/**"
  - "**/home/**/.cache/**"
ingress: true
ingress_port: 30142
ingress_stream: true
panel_icon: mdi:robot
panel_title: Pi Agent
panel_admin: true
watchdog: "http://[HOST]:[PORT:30142]/api/home"
options:
  api_key: ""
  minimax_api_key: ""
  openai_api_key: ""
  openrouter_api_key: ""
  anthropic_api_key: ""
  deepseek_api_key: ""
  groq_api_key: ""
schema:
  api_key: password?
  minimax_api_key: password?
  openai_api_key: password?
  openrouter_api_key: password?
  anthropic_api_key: password?
  deepseek_api_key: password?
  groq_api_key: password?
image: ghcr.io/woowtech/woow-ha-pi-agent-{arch}
