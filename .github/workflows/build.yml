name: Build & Publish add-on image
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          platform: linux/amd64
          runner: ubuntu-24.04
        - arch: aarch64
          platform: linux/arm64
          runner: ubuntu-24.04-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Read add-on metadata
      id: meta
      run: "{\n  echo \"name=$(yq '.name' config.yaml)\"\n  echo \"description=$(yq '.description' config.yaml)\"\n  echo\
        \ \"version=$(yq '.version' config.yaml)\"\n  echo \"base_image=$(yq '.build_from.${{ matrix.arch }}' build.yaml)\"\
        \n} >> \"$GITHUB_OUTPUT\"\n"
    - name: Checkout pinned distribution tooling
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: WOOWTECH/Woow_HA_App_Store
        ref: 26bb83db3b28db67c33b13350f3be6cddc880527
        path: .sync-tooling
        sparse-checkout: .addon-sync
        persist-credentials: false
    - name: Install immutable-image guard dependencies
      run: python3 -m pip install -r .sync-tooling/.addon-sync/requirements.txt
    - name: Reuse existing version without overwriting its image
      id: existing
      if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ADDON_VERSION: ${{ steps.meta.outputs.version }}
        ADDON_ARCH: ${{ matrix.arch }}
      run: python3 .sync-tooling/.addon-sync/pi_image_reuse.py --arch "$ADDON_ARCH" --version "$ADDON_VERSION"
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3
      if: steps.existing.outputs.reuse != 'true'
    - name: Stage and validate local source-build context
      id: local-context
      if: github.event_name == 'pull_request' && steps.existing.outputs.reuse != 'true'
      run: |
        python3 tests/source-build-context.py --tooling .sync-tooling/.addon-sync \
          --arch '${{ matrix.arch }}' --destination "$RUNNER_TEMP/local-addon-source" \
          --receipt "$RUNNER_TEMP/local-source-${{ matrix.arch }}.json" \
          --github-output "$GITHUB_OUTPUT"
    - name: Log in to GHCR
      if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build & push
      uses: docker/build-push-action@v6
      with:
        # PRs build the actual downloader-generated local source context.
        # Its Dockerfile and every build input are verified byte/mode-identical.
        context: ${{ github.event_name == 'pull_request' && steps.local-context.outputs.context || '.' }}
        platforms: ${{ matrix.platform }}
        push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
        provenance: false
        tags: 'ghcr.io/woowtech/woow-ha-pi-agent-${{ matrix.arch }}:${{ steps.meta.outputs.version }}

          ghcr.io/woowtech/woow-ha-pi-agent-${{ matrix.arch }}:latest

          '
        build-args: 'BUILD_FROM=${{ steps.meta.outputs.base_image }}

          BUILD_ARCH=${{ matrix.arch }}

          BUILD_VERSION=${{ steps.meta.outputs.version }}

          BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}

          BUILD_DESCRIPTION=${{ steps.meta.outputs.description }}

          BUILD_NAME=${{ steps.meta.outputs.name }}

          BUILD_REF=${{ github.sha }}

          BUILD_REPOSITORY=${{ github.repository }}

          '
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      if: steps.existing.outputs.reuse != 'true'
    - name: Retain local source-build evidence
      if: always() && github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ha-local-source-${{ matrix.arch }}
        path: ${{ runner.temp }}/local-source-${{ matrix.arch }}.json
        if-no-files-found: ignore
    - name: Enforce transport-safe image layers
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.existing.outputs.reuse != 'true'
      env:
        ARCH: ${{ matrix.arch }}
        VERSION: ${{ steps.meta.outputs.version }}
      run: |
        BASELINE="$(cat tests/image-layer-baseline)"
        docker buildx imagetools inspect --raw "ghcr.io/woowtech/woow-ha-pi-agent-${ARCH}:${BASELINE}" > /tmp/baseline-manifest.json
        docker buildx imagetools inspect --raw "ghcr.io/woowtech/woow-ha-pi-agent-${ARCH}:${VERSION}" \
          | node tests/assert-image-layer-sizes.mjs /tmp/baseline-manifest.json
    needs:
    - test
  # The App Store ships only published Releases (registry ref_policy: release).
  # After the checks above pass on main, the Store's shared workflow publishes
  # the Release for a config.yaml version that has none yet.
  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-release.yml@main
  test:
    name: Ingress shim regression and patch syntax
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Validate native settings against the official compiled Pi Web artifact
      run: |
        mkdir -p "$RUNNER_TEMP/pi-web-native"
        npm pack @agegr/pi-web@0.12.0 --pack-destination "$RUNNER_TEMP/pi-web-native"
        tar -xzf "$RUNNER_TEMP/pi-web-native/agegr-pi-web-0.12.0.tgz" -C "$RUNNER_TEMP/pi-web-native"
        PI_WEB_ROOT="$RUNNER_TEMP/pi-web-native/package" node --test patches/tests/omnigent-settings.test.mjs
    - name: Exercise compiled native settings and Ingress fallback in Chromium
      run: |
        sudo apt-get update && sudo apt-get install -y nginx
        npm install --omit=dev --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/pi-web-native/package" \
          @earendil-works/pi-codemode@1.1.0 @earendil-works/pi-mcp@1.1.0 @earendil-works/chord@1.1.0
        npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/ha-browser" playwright@1.62.1
        node "$RUNNER_TEMP/ha-browser/node_modules/playwright/cli.js" install --with-deps chromium
        node patches/patch-omnigent-settings.mjs "$RUNNER_TEMP/pi-web-native/package"
        curl -fLsS --retry 3 https://github.com/WOOWTECH/pi-paseo-plugin/releases/download/v0.1.13/woowtech-pi-paseo-0.1.13.tgz -o "$RUNNER_TEMP/paseo.tgz"
        echo "cc01207d7fe13cdd8ea4e20c23806b53ff0c2457d297179b36689e5578c6d1f0  $RUNNER_TEMP/paseo.tgz" | sha256sum --check --strict
        mkdir -p "$RUNNER_TEMP/pi-paseo"
        tar -xzf "$RUNNER_TEMP/paseo.tgz" --strip-components=1 -C "$RUNNER_TEMP/pi-paseo"
        export PASEO_PLUGIN_ROOT="$RUNNER_TEMP/pi-paseo"
        export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ha-browser/node_modules/playwright/index.mjs"
        PI_WEB_ROOT="$RUNNER_TEMP/pi-web-native/package" EVIDENCE_DIR="$RUNNER_TEMP/ha-native-evidence" node tests/omnigent-native-browser.mjs
        node tests/omnigent-browser.mjs
    - name: Retain native settings browser evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ha-native-settings-browser
        path: ${{ runner.temp }}/ha-native-evidence
        if-no-files-found: ignore
    - name: Ingress shim and ChatGPT OAuth patch tests
      run: |
        node --test patches/tests/chatgpt-device-id.test.mjs
        node --test tests/omnigent-ha.test.mjs tests/paseo-ha.test.mjs
        for file in rootfs/usr/local/lib/pi-omnigent-ha/*.mjs rootfs/usr/local/share/pi-omnigent-ha/*.js rootfs/usr/local/lib/pi-paseo-ha/*.mjs rootfs/usr/local/share/pi-paseo-ha/*.js; do node --check "$file"; done
        node tests/shared-agent-state.mjs
        node tests/cli-wrappers.mjs
        node --check patches/patch-chatgpt-device-id.mjs
        node tests/shim-routes.mjs
        node tests/haos-network-contract.mjs
        node tests/cli-image-layers.mjs
        for file in patches/*.mjs; do node --check "$file"; done
'on':
  push:
    branches:
    - main
    paths:
    - config.yaml
    - build.yaml
    - Dockerfile
    - rootfs/**
    - cli-runtime/**
    - .github/workflows/build.yml
    - patches/**
    - tests/**
    - .dockerignore
  # PRs run unfiltered so the ruleset's required checks always report (release-gating #88).
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      push:
        description: Push image to GHCR (false = build-only sanity check)
        type: boolean
        default: true
