name: Build & Publish add-on image
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          platform: linux/amd64
          runner: ubuntu-24.04
        - arch: aarch64
          platform: linux/arm64
          runner: ubuntu-24.04-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Read add-on metadata
      id: meta
      run: "{\n  echo \"name=$(yq '.name' config.yaml)\"\n  echo \"description=$(yq '.description' config.yaml)\"\n  echo\
        \ \"version=$(yq '.version' config.yaml)\"\n  echo \"base_image=$(yq '.build_from.${{ matrix.arch }}' build.yaml)\"\
        \n} >> \"$GITHUB_OUTPUT\"\n"
    - name: Checkout pinned distribution tooling
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: WOOWTECH/Woow_HA_App_Store
        ref: 26bb83db3b28db67c33b13350f3be6cddc880527
        path: .sync-tooling
        sparse-checkout: .addon-sync
        persist-credentials: false
    - name: Install immutable-image guard dependencies
      run: python3 -m pip install -r .sync-tooling/.addon-sync/requirements.txt
    - name: Reuse existing version without overwriting its image
      id: existing
      if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ADDON_VERSION: ${{ steps.meta.outputs.version }}
        ADDON_ARCH: ${{ matrix.arch }}
      run: python3 .sync-tooling/.addon-sync/pi_image_reuse.py --arch "$ADDON_ARCH" --version "$ADDON_VERSION"
    # Both native PR jobs load the final image for strict runtime readback.
    # amd64 additionally saves it for SBOM/Store; keep an explicit disk floor
    # after removing the existing unused runner toolchains on either arch.
    - name: Free disk space
      if: github.event_name == 'pull_request'
      run: |
        set -euo pipefail
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /
        free_bytes="$(df -B1 --output=avail / | awk 'NR == 2 {print $1}')"
        [[ "$free_bytes" =~ ^[0-9]+$ ]]
        (( free_bytes >= 20 * 1024 * 1024 * 1024 )) || { echo 'Need at least 20 GiB free before loading the full PR image' >&2; exit 1; }
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3
      if: steps.existing.outputs.reuse != 'true'
    - name: Stage and validate local source-build context
      id: local-context
      if: github.event_name == 'pull_request' && steps.existing.outputs.reuse != 'true'
      run: |
        python3 tests/source-build-context.py --tooling .sync-tooling/.addon-sync \
          --arch '${{ matrix.arch }}' --destination "$RUNNER_TEMP/local-addon-source" \
          --receipt "$RUNNER_TEMP/local-source-${{ matrix.arch }}.json" \
          --github-output "$GITHUB_OUTPUT"
    - name: Log in to GHCR
      if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build & push
      id: addon-image
      uses: docker/build-push-action@v6
      with:
        # PRs build the actual downloader-generated local source context.
        # Its Dockerfile and every build input are verified byte/mode-identical.
        context: ${{ github.event_name == 'pull_request' && steps.local-context.outputs.context || '.' }}
        platforms: ${{ matrix.platform }}
        push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
        # Verify the actual final image on both native PR architectures.
        load: ${{ github.event_name == 'pull_request' }}
        provenance: false
        tags: 'ghcr.io/woowtech/woow-ha-pi-agent-${{ matrix.arch }}:${{ steps.meta.outputs.version }}

          ghcr.io/woowtech/woow-ha-pi-agent-${{ matrix.arch }}:latest

          '
        build-args: 'BUILD_FROM=${{ steps.meta.outputs.base_image }}

          BUILD_ARCH=${{ matrix.arch }}

          BUILD_VERSION=${{ steps.meta.outputs.version }}

          BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}

          BUILD_DESCRIPTION=${{ steps.meta.outputs.description }}

          BUILD_NAME=${{ steps.meta.outputs.name }}

          BUILD_REF=${{ github.sha }}

          BUILD_REPOSITORY=${{ github.repository }}

          '
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      if: steps.existing.outputs.reuse != 'true'
    - name: Verify final installed maintenance on the native image
      if: github.event_name == 'pull_request'
      timeout-minutes: 7
      env:
        CONTEXT: ${{ steps.local-context.outputs.context }}
        ARCH: ${{ matrix.arch }}
        VERSION: ${{ steps.meta.outputs.version }}
        BUILD_ACTION_IMAGE_ID: ${{ steps.addon-image.outputs.imageid }}
        BUILD_ACTION_DIGEST: ${{ steps.addon-image.outputs.digest }}
      run: |
        bash tests/verify-final-maintenance.sh "$CONTEXT" "$ARCH" \
          "ghcr.io/woowtech/woow-ha-pi-agent-${ARCH}:${VERSION}" \
          "$BUILD_ACTION_IMAGE_ID" "$BUILD_ACTION_DIGEST" "$GITHUB_SHA"
    - name: Retain final-image maintenance readback
      if: always() && github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ha-final-image-maintenance-${{ matrix.arch }}
        path: |
          ${{ runner.temp }}/ha-final-image-maintenance-${{ matrix.arch }}.json
          ${{ runner.temp }}/ha-final-image-maintenance-${{ matrix.arch }}.log
        if-no-files-found: warn
    # The SBOM of this image is what the Upgrade comparison scans as the new
    # version (pipeline #89, category 4): pinned Syft from the Store, uploaded
    # as artifact upgrade-comparison-sbom-woow_ha_pi_agent-attempt-<run attempt>.
    # A PR always builds:
    # the reuse guard above (steps.existing) runs only on non-PR events, so a
    # version-bump PR builds even when that version's image already exists.
    # The PR context is the generated local source context, whose Dockerfile
    # and build inputs are verified identical to the repository's. The PR
    # build reads the same gha cache scope as the main build that ships (PRs
    # can read main's cache, main never reads a PR's), so the SBOM is of the
    # layers the Release build reuses.
    - name: SBOM for the upgrade comparison
      if: github.event_name == 'pull_request' && matrix.arch == 'amd64'
      uses: WOOWTECH/Woow_HA_App_Store/.github/actions/addon-sbom@main
      with:
        component: woow_ha_pi_agent
        image: ghcr.io/woowtech/woow-ha-pi-agent-amd64:${{ steps.meta.outputs.version }}
    # The same image is the new version of the upgrade test (pipeline
    # #143, category 2): saved and uploaded as artifact
    # upgrade-comparison-image-woow_ha_pi_agent-attempt-<run attempt>,
    # so the comparison neither rebuilds it nor needs a PR tag on GHCR.
    - name: Image for the upgrade test
      if: github.event_name == 'pull_request' && matrix.arch == 'amd64'
      uses: WOOWTECH/Woow_HA_App_Store/.github/actions/addon-image@main
      with:
        component: woow_ha_pi_agent
        image: ghcr.io/woowtech/woow-ha-pi-agent-amd64:${{ steps.meta.outputs.version }}
    - name: Retain local source-build evidence
      if: always() && github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ha-local-source-${{ matrix.arch }}
        path: ${{ runner.temp }}/local-source-${{ matrix.arch }}.json
        if-no-files-found: ignore
    - name: Enforce transport-safe image layers
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.existing.outputs.reuse != 'true'
      env:
        ARCH: ${{ matrix.arch }}
        VERSION: ${{ steps.meta.outputs.version }}
      run: |
        BASELINE="$(cat tests/image-layer-baseline)"
        docker buildx imagetools inspect --raw "ghcr.io/woowtech/woow-ha-pi-agent-${ARCH}:${BASELINE}" > /tmp/baseline-manifest.json
        docker buildx imagetools inspect --raw "ghcr.io/woowtech/woow-ha-pi-agent-${ARCH}:${VERSION}" \
          | node tests/assert-image-layer-sizes.mjs /tmp/baseline-manifest.json
    needs:
    - test
  # Upgrade comparison (pipeline #89): rules, inputs and re-runs are in the
  # Store README, "升版比對與 `upgrade-notes.yaml`".
  upgrade-comparison:
    name: Upgrade comparison
    permissions:
      contents: read
      actions: read
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-upgrade-check.yml@main
    with:
      sbom_artifact: upgrade-comparison-sbom-*
      image_artifact: upgrade-comparison-image-*
  # The App Store ships only published Releases (registry ref_policy: release).
  # After the checks above pass on main, the Store's shared workflow publishes
  # the Release for a config.yaml version that has none yet.
  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-release.yml@main
  test:
    name: Ingress shim regression and patch syntax
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Native maintenance source and upgrade-hook fixtures
      run: |
        python3 -B tests/native-maintenance-integration.test.py
        python3 -B tests/native-history-upgrade.test.py
        python3 -B tests/final-maintenance-runtime.test.py
        sudo -n python3 -I -B tests/native-history-report-permissions.test.py
    - name: Build pinned Pi Web source and validate native settings
      run: |
        pins=patches/pi-web-source/build-pins.json
        source_ref="$(jq -er .sourceRef "$pins")"
        source_commit="$(jq -er .sourceCommit "$pins")"
        patch="patches/pi-web-source/pi-web-0.12.0-next-16.4.6.patch"
        pi_web_root=/opt/piweb/lib/node_modules/@agegr/pi-web
        sudo mkdir -p "$(dirname "$pi_web_root")"
        sudo chown -R "$(id -u):$(id -g)" /opt/piweb
        git clone --depth=1 --branch "$source_ref" https://github.com/agegr/pi-web.git "$pi_web_root"
        test "$(git -C "$pi_web_root" rev-parse HEAD)" = "$source_commit"
        test "$(git -C "$pi_web_root" rev-parse "refs/tags/$source_ref^{commit}")" = "$source_commit"
        echo "$(jq -er .patchSha256 "$pins")  $patch" | sha256sum --check --strict
        git -C "$pi_web_root" apply "$GITHUB_WORKSPACE/$patch"
        echo "$(jq -er .patchedPackageJsonSha256 "$pins")  $pi_web_root/package.json" | sha256sum --check --strict
        echo "$(jq -er .patchedPackageLockSha256 "$pins")  $pi_web_root/package-lock.json" | sha256sum --check --strict
        cd "$pi_web_root"
        npm ci --include=dev --no-fund
        npm audit --audit-level=high --no-fund
        mapfile -d '' path_utils < <(find "$pi_web_root" -path '*@earendil-works/*/dist/*/tools/path-utils.js' -print0)
        test "${#path_utils[@]}" -ge 1
        node "$GITHUB_WORKSPACE/patches/fix-unicode-space-paths.mjs" "${path_utils[@]}"
        NEXT_TELEMETRY_DISABLED=1 npm run build
        test "$(node -p 'require("./node_modules/next/package.json").version')" = "$(jq -er .nextVersion "$GITHUB_WORKSPACE/$pins")"
        node "$GITHUB_WORKSPACE/patches/patch-chatgpt-device-id.mjs" "$pi_web_root/.next/server/app/api/auth/login/[provider]/route.js"
        node --check "$pi_web_root/.next/server/app/api/auth/login/[provider]/route.js"
        PI_WEB_ROOT="$pi_web_root" node --test "$GITHUB_WORKSPACE/patches/tests/omnigent-settings.test.mjs"
    - name: Prepare Pi Web production dependencies as the image does
      run: |
        pi_web_root=/opt/piweb/lib/node_modules/@agegr/pi-web
        npm prune --omit=dev --ignore-scripts --no-audit --no-fund --prefix "$pi_web_root"
        node -e 'for (const name of ["@earendil-works/pi-codemode", "@earendil-works/pi-mcp", "@earendil-works/chord"]) { const p=require(process.argv[1]+"/node_modules/"+name+"/package.json"); if(p.version!=="1.1.0") throw new Error(name+" "+p.version); }' "$pi_web_root"
    - name: Verify shared runtime migration against the image SDK
      run: |
        echo "0914069fb0cf83f258cf81034bb16573f6e4242e8779cea47b4a5e841f98a937  candidate-packages/woowtech-pi-agent-shared-runtime-0.1.6.tgz" | sha256sum --check --strict
        mkdir -p "$RUNNER_TEMP/shared-runtime"
        tar -xzf candidate-packages/woowtech-pi-agent-shared-runtime-0.1.6.tgz --strip-components=1 -C "$RUNNER_TEMP/shared-runtime"
        npm ci --prefix "$RUNNER_TEMP/shared-runtime" --omit=dev --legacy-peer-deps --ignore-scripts --no-audit --no-fund
        SHARED_RUNTIME_TEST_BUNDLE="$RUNNER_TEMP/shared-runtime" PI_SHARED_SDK_ROOT="$RUNNER_TEMP/pi-web-native/package" node --test tests/shared-distribution.test.mjs tests/shared-sync-only.test.mjs
        PI_SHARED_SDK_ROOT="$RUNNER_TEMP/pi-web-native/package" node --test "$RUNNER_TEMP/shared-runtime/tests/resource-authority.test.mjs" "$RUNNER_TEMP/shared-runtime/tests/resource-boundary.test.mjs" "$RUNNER_TEMP/shared-runtime/tests/extension-scan.test.mjs" "$RUNNER_TEMP/shared-runtime/tests/bridge.test.mjs" "$RUNNER_TEMP/shared-runtime/tests/mcp-adapter.test.mjs"
    # The exact vendored plugins from cli-runtime/versions.json, driven by the add-on's
    # seed, lifecycle and Settings bridge in seconds, before any image build:
    # Omnigent: fresh install, same-path upgrade and a plugin source switch.
    # Agent Connect: its real status, target save and pairing links.
    - name: Version pins and frozen plugin contracts
      run: |
        node --test tests/versions.test.mjs
        archive="$(jq -er '.omnigentPlugin.archive' cli-runtime/versions.json)"
        sha256="$(jq -er '.omnigentPlugin.sha256' cli-runtime/versions.json)"
        cp "$archive" "$RUNNER_TEMP/omnigent-plugin.tgz"
        echo "$sha256  $RUNNER_TEMP/omnigent-plugin.tgz" | sha256sum --check --strict
        OMNIGENT_PLUGIN_TGZ="$RUNNER_TEMP/omnigent-plugin.tgz" PI_WEB_ROOT=/opt/piweb/lib/node_modules/@agegr/pi-web \
          node --test tests/omnigent-contract.test.mjs
        archive="$(jq -er '.agentConnect.archive' cli-runtime/versions.json)"
        sha256="$(jq -er '.agentConnect.sha256' cli-runtime/versions.json)"
        cp "$archive" "$RUNNER_TEMP/agent-connect.tgz"
        echo "$sha256  $RUNNER_TEMP/agent-connect.tgz" | sha256sum --check --strict
        PASEO_PLUGIN_TGZ="$RUNNER_TEMP/agent-connect.tgz" PI_WEB_ROOT=/opt/piweb/lib/node_modules/@agegr/pi-web \
          node --test tests/paseo-contract.test.mjs
    - name: Exercise compiled native settings and Ingress fallback in Chromium
      run: |
        sudo apt-get update && sudo apt-get install -y nginx
        npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/ha-browser" playwright@1.62.1
        node "$RUNNER_TEMP/ha-browser/node_modules/playwright/cli.js" install --with-deps chromium
        node patches/patch-omnigent-settings.mjs /opt/piweb/lib/node_modules/@agegr/pi-web
        export PLAYWRIGHT_MODULE="$RUNNER_TEMP/ha-browser/node_modules/playwright/index.mjs"
        PI_WEB_ROOT=/opt/piweb/lib/node_modules/@agegr/pi-web EVIDENCE_DIR="$RUNNER_TEMP/ha-native-evidence" node tests/omnigent-native-browser.mjs
        node tests/omnigent-browser.mjs
        node tests/paseo-browser.mjs
    - name: Retain native settings browser evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ha-native-settings-browser
        path: ${{ runner.temp }}/ha-native-evidence
        if-no-files-found: ignore
    - name: Ingress shim and ChatGPT OAuth patch tests
      run: |
        node --test patches/tests/chatgpt-device-id.test.mjs
        node --test tests/omnigent-ha.test.mjs tests/paseo-ha.test.mjs tests/paseo-settings-ui.test.mjs tests/paseo-launch.test.mjs tests/paseo-runtime-dir.test.mjs tests/paseo-runtime-layers.test.mjs tests/launcher-stop.test.mjs
        for file in rootfs/usr/local/lib/pi-omnigent-ha/*.mjs rootfs/usr/local/share/pi-omnigent-ha/*.js rootfs/usr/local/lib/pi-paseo-ha/*.mjs rootfs/usr/local/share/pi-paseo-ha/*.js; do node --check "$file"; done
        node tests/shared-agent-state.mjs
        node tests/cli-wrappers.mjs
        node --check patches/patch-chatgpt-device-id.mjs
        node tests/shim-routes.mjs
        node tests/haos-network-contract.mjs
        node tests/cli-image-layers.mjs
        for file in patches/*.mjs; do node --check "$file"; done
'on':
  push:
    branches:
    - main
    paths:
    - config.yaml
    - build.yaml
    - Dockerfile
    - rootfs/**
    - cli-runtime/**
    - .github/workflows/build.yml
    - patches/**
    - tests/**
    - .dockerignore
  # PRs run unfiltered so the ruleset's required checks always report (release-gating #88).
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      push:
        description: Push image to GHCR (false = build-only sanity check)
        type: boolean
        default: false
