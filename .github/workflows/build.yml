name: Build & Publish add-on image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - config.yaml
      - build.yaml
      - Dockerfile
      - rootfs/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      push:
        description: Push image to GHCR (false = build-only sanity check)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on metadata
        id: meta
        run: |
          {
            echo "name=$(yq '.name' config.yaml)"
            echo "description=$(yq '.description' config.yaml)"
            echo "version=$(yq '.version' config.yaml)"
            echo "base_image=$(yq '.build_from.${{ matrix.arch }}' build.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
          provenance: false
          tags: |
            ghcr.io/woowtech/woow-ha-pi-agent-${{ matrix.arch }}:${{ steps.meta.outputs.version }}
            ghcr.io/woowtech/woow-ha-pi-agent-${{ matrix.arch }}:latest
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.base_image }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            BUILD_DESCRIPTION=${{ steps.meta.outputs.description }}
            BUILD_NAME=${{ steps.meta.outputs.name }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
