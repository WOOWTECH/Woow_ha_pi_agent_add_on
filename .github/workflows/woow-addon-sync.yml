name: WOOW addon source notification
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
  schedule:
  - cron: 23 */6 * * *
  workflow_run:
    workflows:
    - Build & Publish add-on image
    types:
    - completed
permissions:
  contents: write
  actions: read
concurrency:
  group: woow-addon-source-notification
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion ==
      'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.event != 'pull_request_target'
      && github.event.workflow_run.head_repository.full_name == github.repository))
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-publish.yml@main
