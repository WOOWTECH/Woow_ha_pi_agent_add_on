daemon off;
pid /var/run/nginx.pid;
worker_processes 1;
error_log /dev/stderr info;

events {
    worker_connections 512;
}

http {
    access_log /dev/stdout;

    default_type application/octet-stream;
    include /etc/nginx/mime.types;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # HA Supervisor talks WebSocket for chat streaming — allow long-lived upstream connections.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;

    # Body-rewrite settings. sub_filter can't inspect compressed bodies, so we
    # tell pi-web (upstream) to never gzip; the browser still gets whatever
    # HA Supervisor's ingress layer chooses to compress.
    sub_filter_once off;
    sub_filter_last_modified on;
    sub_filter_types text/html text/css application/javascript application/x-javascript;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 30142 default_server;

        # Home Assistant Supervisor injects X-Ingress-Path with the current
        # ingress prefix (e.g. /api/hassio_ingress/<token>). We prepend it to
        # every absolute path pi-web emits so browser requests round-trip
        # back through the Supervisor's ingress proxy.
        location / {
            proxy_pass http://127.0.0.1:30141;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Force uncompressed upstream so sub_filter can rewrite the body.
            proxy_set_header Accept-Encoding "";

            # HTML — absolute path attributes.
            sub_filter 'href="/_next/'    'href="$http_x_ingress_path/_next/';
            sub_filter 'src="/_next/'     'src="$http_x_ingress_path/_next/';
            sub_filter 'href="/favicon'   'href="$http_x_ingress_path/favicon';

            # RSC flight payloads (JSON-escaped inside script tags).
            sub_filter '\"/_next/'        '\"$http_x_ingress_path/_next/';
            sub_filter '\"/favicon'       '\"$http_x_ingress_path/favicon';

            # CSS — url(/_next/...) references for fonts / media.
            sub_filter 'url(/_next/'      'url($http_x_ingress_path/_next/';

            # Webpack chunk loader constants inside JS.
            sub_filter '"/_next/'         '"$http_x_ingress_path/_next/';
        }
    }
}
