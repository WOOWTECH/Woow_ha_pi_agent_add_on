daemon off;
pid /var/run/nginx.pid;
worker_processes 1;
error_log /dev/stderr info;

events {
    worker_connections 512;
}

http {
    access_log /dev/stdout;

    default_type application/octet-stream;
    include /etc/nginx/mime.types;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # HA Supervisor talks WebSocket for chat streaming — allow long-lived upstream connections.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;

    # Body-rewrite settings. sub_filter can't inspect compressed bodies, so we
    # tell pi-web (upstream) to never gzip; the browser still gets whatever
    # HA Supervisor's ingress layer chooses to compress.
    sub_filter_once off;
    sub_filter_last_modified on;
    sub_filter_types text/html text/css application/javascript application/x-javascript;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 30142 default_server;

        # Home Assistant Supervisor injects X-Ingress-Path with the current
        # ingress prefix (e.g. /api/hassio_ingress/<token>). We prepend it to
        # every absolute path pi-web emits so browser requests round-trip
        # back through the Supervisor's ingress proxy.
        location / {
            proxy_pass http://127.0.0.1:30141;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Force uncompressed upstream so sub_filter can rewrite the body.
            proxy_set_header Accept-Encoding "";

            # HTML — absolute path attributes.
            sub_filter 'href="/_next/'    'href="$http_x_ingress_path/_next/';
            sub_filter 'src="/_next/'     'src="$http_x_ingress_path/_next/';
            sub_filter 'href="/favicon'   'href="$http_x_ingress_path/favicon';

            # RSC flight payloads (JSON-escaped inside script tags).
            sub_filter '\"/_next/'        '\"$http_x_ingress_path/_next/';
            sub_filter '\"/favicon'       '\"$http_x_ingress_path/favicon';

            # CSS — url(/_next/...) references for fonts / media.
            sub_filter 'url(/_next/'      'url($http_x_ingress_path/_next/';

            # Webpack chunk loader constants inside JS.
            sub_filter '"/_next/'         '"$http_x_ingress_path/_next/';

            # pi-web's client-side JS calls /api/* on absolute paths (fetch,
            # EventSource, XHR — over 40 distinct routes: /api/sessions,
            # /api/skills, /api/agent/*, /api/auth/*, /api/files/*, /api/git/*,
            # /api/plugins, /api/models*, /api/worktrees, ...). Rewriting them
            # via sub_filter is unsafe (the bundle already contains one
            # /api/hassio_ingress/... literal that must NOT be double-prefixed).
            # Instead inject a shim at </head> that monkey-patches fetch /
            # EventSource / XMLHttpRequest to prepend the ingress prefix to
            # any /api/*, /_next/*, or /favicon* request not already carrying
            # /api/hassio_ingress/. Guarded by isTargetPath() so any full URL,
            # blob:, data:, or /api/hassio_ingress/ path passes through
            # unchanged.
            sub_filter '</head>' '<script>window.__INGRESS_PATH__="$http_x_ingress_path";(function(){var P=window.__INGRESS_PATH__||"";if(!P)return;var T=function(u){return typeof u==="string"&&u.charAt(0)==="/"&&u.indexOf("/api/hassio_ingress/")!==0&&(u.indexOf("/api/")===0||u.indexOf("/_next/")===0||u.indexOf("/favicon")===0)};var F=window.fetch;window.fetch=function(i,o){if(typeof i==="string"&&T(i)){i=P+i}else if(i&&i.url){var u=i.url.replace(location.origin,"");if(T(u))i=new Request(P+u,i)}return F(i,o)};var E=window.EventSource;if(E){var NE=function(u,o){if(T(u))u=P+u;return new E(u,o)};NE.prototype=E.prototype;NE.CONNECTING=0;NE.OPEN=1;NE.CLOSED=2;window.EventSource=NE}var X=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){if(T(u))arguments[1]=P+u;return X.apply(this,arguments)}})();</script></head>';
        }
    }
}
